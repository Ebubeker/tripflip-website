<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submitted Successfully</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --accent-color: #bd3972;
            --accent-dark: #bd3972;
            --text-primary: #2d2d2d;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --bg-primary: #f5f1eb;
            --bg-secondary: #ffffff;
            --bg-dark: #2d2d2d;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f1eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .container {
            text-align: center;
            max-width: 28rem;
            width: 100%;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .success-icon {
            width: 5rem;
            height: 5rem;
            border: 2px solid #bd3972;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkmark {
            width: 2.5rem;
            height: 2.5rem;
            color: #bd3972;
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #bd3972;
            margin-bottom: 1rem;
        }

        .message-container {
            margin-bottom: 2rem;
        }

        .message-text {
            color: #374151;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .go-back-btn {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background-color: transparent;
            border: 1px solid #bd3972;
            color: #374151;
            text-decoration: none;
            border-radius: 0.375rem;
            transition: all 0.2s ease-in-out;
            font-size: 1rem;
        }

        .go-back-btn:hover {
            background-color: #bd3972;
            color: white;
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .footer a {
            color: #bd3972;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .success-title {
                font-size: 1.25rem;
            }
            
            .container {
                padding: 0 1rem;
            }
            
            .footer {
                position: relative;
                margin-top: 4rem;
                bottom: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Success Icon -->
        <div class="icon-container">
            <div class="success-icon">
                <svg class="checkmark" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Success Message -->
        <h1 class="success-title">Form submitted successfully!</h1>
        
        <div class="message-container">
            <p class="message-text">Thank you! The form has been submitted successfully.</p>
            <p class="message-text">We will reply to you soon!</p>
        </div>

        <!-- Go Back Button -->
        <a href="#" class="go-back-btn">Go back</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Create your own contact form at <a href="https://web3forms.com" target="_blank" rel="noopener noreferrer">Web3Forms</a></p>
    </div>
</body>
</html>
